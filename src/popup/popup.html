<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Forte</title>
  <link rel="stylesheet" href="popup.css">
  <link rel="stylesheet" href="../shared/support.css">
</head>
<body>
  <header>
    <span class="brand"><img src="../icons/icon.svg" alt="" width="18" height="18"> Forte</span>
    <a class="support-pill" data-support title="Forte is free forever, with no ads and no tracking. Tips keep it maintained."><span class="heart">&#x2665;</span> Support</a>
    <button id="btnOptions" class="icon-btn" title="Settings" aria-label="Settings">&#x2699;</button>
  </header>

  <main>
    <div id="notice" class="notice" hidden></div>

    <section id="controls">
      <div class="vol-row">
        <button id="btnDown" class="round" title="Quieter" aria-label="Quieter">&#x2212;</button>
        <output id="gain" aria-live="polite">100%</output>
        <button id="btnUp" class="round" title="Louder" aria-label="Louder">+</button>
      </div>
      <input id="slider" type="range" min="0" max="600" step="5" value="100" aria-label="Volume">
      <div id="presets" class="presets"></div>
      <div class="meter" title="Output level">
        <div class="meter-track"><div id="meterBar" class="meter-bar"></div></div>
        <span id="limTag" class="lim-tag" title="The limiter is holding peaks down so the boost doesn't distort">limiter</span>
      </div>

      <div class="eq">
        <div class="eq-head">
          <span class="eq-title">Equalizer</span>
          <select id="preset" aria-label="Equalizer preset"></select>
        </div>
        <div id="bands" class="bands"></div>
        <div class="eq-opts">
          <label class="check"><input id="compressor" type="checkbox"> <span>Even out loud and quiet parts</span></label>
          <label class="check"><input id="mono" type="checkbox"> <span>Mono</span></label>
          <label class="balance"><span>L</span><input id="balance" type="range" min="-100" max="100" step="5" value="0" aria-label="Balance"><span>R</span></label>
        </div>
      </div>
    </section>

    <p id="status" class="status" aria-live="polite"></p>

    <section class="site-row">
      <label class="switch">
        <input id="siteEnabled" type="checkbox" checked>
        <span>On for <strong id="siteName">this site</strong></span>
      </label>
      <button id="btnReset" class="link-btn" type="button" title="Back to 100% with a flat EQ">Reset</button>
    </section>

    <div id="supportCard" hidden></div>
  </main>

  <script type="module" src="popup.js"></script>
</body>
</html>
